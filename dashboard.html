<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Poll Voting System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="dashboard">
  <nav>
    <div class="logo">Live Results Dashboard</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="vote.html">Vote</a>
      <a class="active" href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="container">
    <div class="poll-header">
      <div class="poll-title">
        <h1>Live Poll Results</h1>
        <p>Results update automatically when voters submit their votes.</p>
      </div>
      <a class="btn secondary" href="vote.html">Open Voting Page</a>
    </div>

    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Votes</div>
        <div id="totalVotes" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Aspirants</div>
        <div id="totalAspirants" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Leading Aspirant</div>
        <div id="leadingName" class="kpi-value" style="font-size:25px">-</div>
      </div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Vote Share</h2>
        <div class="chart-box"><canvas id="pieChart" width="420" height="320"></canvas></div>
      </div>
      <div class="card">
        <h2>Votes by Aspirant</h2>
        <div class="chart-box"><canvas id="barChart" width="620" height="320"></canvas></div>
      </div>
    </section>

    <section class="card" style="margin-top: 22px;">
      <h2>Results by Aspirant</h2>
      <div id="resultsList"></div>
    </section>

    <section class="card" style="margin-top: 22px;">
      <h2>Detailed Table</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Aspirant</th>
              <th>Position</th>
              <th>Votes</th>
              <th>Percentage</th>
            </tr>
          </thead>
          <tbody id="resultsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
